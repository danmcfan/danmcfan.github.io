<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A personal website featuring Danny O'Brien's projects.">
    <title>Danny O'Brien</title>
    <link rel="shortcut icon" href="/img/favicon.svg">
    <link rel="stylesheet" href="/css/output.css">
    <script src="//unpkg.com/alpinejs" defer></script>
</head>
<body>
    <main class="flex flex-col items-center h-screen gap-8 p-8 pt-16 md:p-16">
        <h1 class="text-4xl font-bold">Danny O'Brien</h1>
        <ul
            class="flex flex-col items-center w-full md:w-xl gap-4"
            x-cloak
            x-data="{
                links: [
                    {
                        name: 'Arcade',
                        href: 'https://arcade.danny-obrien.com',
                        src: '/img/gamepad.svg'
                    },
                    {
                        name: 'Fantasy Factory',
                        href: 'https://fantasy-factory.danny-obrien.com',
                        src: '/img/wand.svg'
                    },
                    {
                        name: 'Smart Farm',
                        href: 'https://smart-farm.danny-obrien.com',
                        src: '/img/earth.svg'
                    },
                    {
                        name: 'GitHub',
                        href: 'https://github.com/danmcfan',
                        src: '/img/github.svg'
                    },
                    {
                        name: 'LinkedIn',
                        href: 'https://www.linkedin.com/in/daniel-c-obrien/',
                        src: '/img/linkedin.svg'
                    }
                ]
            }"
        >
            <template x-for="link in links" :key="link.name">
                <li class="relative flex flex-col items-center w-full">
                    <a
                        class="z-10 relative flex items-center w-full bg-white text-black text-lg rounded-lg border-black border-2 p-4 hover:translate-x-1 hover:translate-y-1"
                        :href="link.href"
                        target="_blank"
                    >
                        <img class="absolute left-4 w-8 h-8" :src="link.src" :alt="link.name">
                        <span x-text="link.name" class="flex-1 text-center font-bold"></span>
                    </a>
                    <div class="absolute top-2 left-2 w-full h-16 bg-black rounded-lg"></div>
                </li>
            </template>
        </ul>
    </main>
</body>
</html>
