<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback for history-based routing.
      const pathSegmentsToKeep = 0;
      const { location } = window;
      const redirectPath = `${location.protocol}//${location.hostname}${
        location.port ? `:${location.port}` : ""
      }${location.pathname
        .split("/")
        .slice(0, 1 + pathSegmentsToKeep)
        .join("/")}/?/${location.pathname
        .slice(1)
        .split("/")
        .slice(pathSegmentsToKeep)
        .join("/")
        .replace(/&/g, "~and~")}${
        location.search
          ? `&${location.search.slice(1).replace(/&/g, "~and~")}`
          : ""
      }${location.hash}`;

      location.replace(redirectPath);
    </script>
  </head>
  <body></body>
</html>
