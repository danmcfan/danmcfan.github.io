<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback for history-based routing.
      const pathSegmentsToKeep = 0;
      const currentLocation = window.location;
      const redirectPath = `${currentLocation.protocol}//${currentLocation.hostname}${
        currentLocation.port ? `:${currentLocation.port}` : ""
      }${currentLocation.pathname
        .split("/")
        .slice(0, 1 + pathSegmentsToKeep)
        .join("/")}/?/${currentLocation.pathname
        .slice(1)
        .split("/")
        .slice(pathSegmentsToKeep)
        .join("/")
        .replace(/&/g, "~and~")}${
        currentLocation.search
          ? `&${currentLocation.search.slice(1).replace(/&/g, "~and~")}`
          : ""
      }${currentLocation.hash}`;

      window.location.replace(redirectPath);
    </script>
  </head>
  <body></body>
</html>
